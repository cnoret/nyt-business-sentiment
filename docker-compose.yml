# Local MLOps stack: PostgreSQL, S3-compatible storage (RustFS), MLflow,
# Airflow 3 (LocalExecutor) and the Streamlit dashboard.
#
#   cp .env.example .env   # add your NYT_API_KEY
#   docker compose up -d --build
#
# Airflow  http://localhost:8080   (no login in this local setup)
# MLflow   http://localhost:5000
# Streamlit http://localhost:8501
# RustFS   http://localhost:9001   (S3 console)

x-s3-env: &s3-env
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-nytadmin}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-nytadmin-secret}
  AWS_DEFAULT_REGION: us-east-1

x-airflow: &airflow
  build:
    context: .
    dockerfile: airflow/Dockerfile
  image: nyt-sentiment-airflow
  environment: &airflow-env
    <<: *s3-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://nyt:${POSTGRES_PASSWORD:-nyt}@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__API_AUTH__JWT_SECRET: local-dev-only-secret
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    NYT_API_KEY: ${NYT_API_KEY:-}
    DATABASE_URL: postgresql+psycopg2://nyt:${POSTGRES_PASSWORD:-nyt}@postgres/nyt
    S3_ENDPOINT_URL: http://rustfs:9000
    S3_BUCKET: nyt-sentiment
    MLFLOW_TRACKING_URI: http://mlflow:5000
    STREAMLIT_APP_URL: http://streamlit:8501/_stcore/health
    SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    HF_HOME: /opt/airflow/hf-cache
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - airflow-logs:/opt/airflow/logs
    - hf-cache:/opt/airflow/hf-cache
  depends_on: &airflow-depends
    postgres:
      condition: service_healthy
    airflow-init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nyt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nyt}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "nyt"]
      interval: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-nytadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-nytadmin-secret}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - s3-data:/data
    ports: ["9000:9000", "9001:9001"]

  mlflow:
    build: docker/mlflow
    image: nyt-sentiment-mlflow
    environment:
      <<: *s3-env
      MLFLOW_S3_ENDPOINT_URL: http://rustfs:9000
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql+psycopg2://nyt:${POSTGRES_PASSWORD:-nyt}@postgres/mlflow
      --artifacts-destination s3://mlflow
      --allowed-hosts "mlflow:5000,localhost:5000,127.0.0.1:5000"
    ports: ["5000:5000"]
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate
        python - <<'PY'
        import time, boto3
        s3 = boto3.client("s3", endpoint_url="http://rustfs:9000")
        for attempt in range(30):
            try:
                existing = {b["Name"] for b in s3.list_buckets().get("Buckets", [])}
                break
            except Exception:
                time.sleep(2)
        for bucket in ("nyt-sentiment", "mlflow"):
            if bucket not in existing:
                s3.create_bucket(Bucket=bucket)
        print("Buckets ready")
        PY

  airflow-apiserver:
    <<: *airflow
    command: api-server
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 15s
      retries: 10
      start_period: 30s

  airflow-scheduler:
    <<: *airflow
    command: scheduler

  airflow-dag-processor:
    <<: *airflow
    command: dag-processor

  streamlit:
    build:
      context: .
      dockerfile: streamlit/Dockerfile
    image: nyt-sentiment-streamlit
    environment:
      DATABASE_URL: postgresql+psycopg2://nyt:${POSTGRES_PASSWORD:-nyt}@postgres/nyt
    ports: ["8501:8501"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  s3-data:
  airflow-logs:
  hf-cache:

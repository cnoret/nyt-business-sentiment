[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nyt-sentiment"
version = "1.0.0"
description = "Sentiment index and forecast of New York Times business news."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<4",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
ml = [
    "prophet>=1.1.6,<2",
    "transformers>=4.46,<6",
    "torch>=2.4,<3",
]
storage = [
    "sqlalchemy>=2.0,<3",
    "psycopg2-binary>=2.9,<3",
    "boto3>=1.35,<2",
    "mlflow-skinny>=2.17,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
